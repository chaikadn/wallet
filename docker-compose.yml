services:
  wallet:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
      - config.env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    env_file:
      - .env
      - config.env
    volumes:
      - pg-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg-data:
